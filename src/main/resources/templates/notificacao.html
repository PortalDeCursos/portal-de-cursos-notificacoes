<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0; padding:0; background-color:#f4f7fd; font-family:Arial, Helvetica, sans-serif;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f7fd; padding:32px 12px;">
    <tr>
        <td align="center">

            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   style="max-width:600px; width:100%; background-color:#ffffff; border-radius:16px;">

                <!-- Cabeçalho -->
                <tr>
                    <td style="padding:32px 40px 20px 40px; border-bottom:1px solid #e6ecf5;">
                        <span style="font-size:26px; font-weight:bold; color:#0b1220;">Portal de </span><span
                            style="font-size:26px; font-weight:bold; color:#0a4de0;">Cursos</span>
                    </td>
                </tr>

                <!-- Título e mensagem -->
                <tr>
                    <td style="padding:32px 40px 8px 40px;">
                        <h1 style="margin:0 0 12px 0; font-size:28px; color:#0a4de0;" th:text="${titulo}">Título</h1>
                        <p style="margin:0; font-size:16px; line-height:1.6; color:#1f2a44;" th:text="${mensagem}">
                            Mensagem
                        </p>
                    </td>
                </tr>

                <!-- Justificativa (só aparece quando vier preenchida) -->
                <tr th:if="${justificativa != null and !#strings.isEmpty(justificativa)}">
                    <td style="padding:20px 40px 0 40px;">
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                               style="background-color:#fff4f4; border-left:4px solid #d93025; border-radius:8px;">
                            <tr>
                                <td style="padding:16px 20px;">
                                    <p style="margin:0 0 6px 0; font-size:14px; font-weight:bold; color:#d93025;">
                                        Justificativa
                                    </p>
                                    <p style="margin:0; font-size:15px; line-height:1.5; color:#1f2a44;"
                                       th:text="${justificativa}">Motivo</p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Resumo do projeto -->
                <tr>
                    <td style="padding:28px 40px 36px 40px;">
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                               style="background-color:#f4f7fd; border-radius:12px;">
                            <tr>
                                <td colspan="2" style="padding:20px 24px 8px 24px;">
                                    <span style="font-size:17px; font-weight:bold; color:#0a4de0;">
                                        Resumo do projeto
                                    </span>
                                </td>
                            </tr>
                            <tr>
                                <td width="30%" style="padding:12px 24px; font-size:14px; font-weight:bold; color:#5b6784; border-bottom:1px solid #e1e8f3;">
                                    Projeto
                                </td>
                                <td style="padding:12px 24px; font-size:15px; color:#0b1220; border-bottom:1px solid #e1e8f3;"
                                    th:text="${nomeProjeto}">Nome</td>
                            </tr>
                            <tr>
                                <td width="30%" style="padding:12px 24px 20px 24px; font-size:14px; font-weight:bold; color:#5b6784;">
                                    Tipo
                                </td>
                                <td style="padding:12px 24px 20px 24px; font-size:15px; color:#0b1220;"
                                    th:text="${tipoProjeto}">Tipo</td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Rodapé -->
                <tr>
                    <td style="padding:20px 40px 28px 40px; background-color:#f7f9fd; border-top:1px solid #e6ecf5; border-radius:0 0 16px 16px;">
                        <p style="margin:0 0 4px 0; font-size:13px; color:#5b6784;">
                            Este e-mail foi enviado automaticamente pelo Portal de Cursos.
                        </p>
                        <p style="margin:0; font-size:13px; color:#5b6784;">© Portal de Cursos</p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>

</body>
</html>
